<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Design Workshop</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  
  <header class="bg-dark text-white py-5">
    <div class="container">
      <span class="badge bg-warning text-dark mb-2">Free workshop</span>
      <h1 class="display-5 fw-bold">Web Design Workshop</h1>
      <p class="lead mb-0">Build your first responsive webpage with HTML and Bootstrap.</p>
    </div>
  </header>

  <main class="container my-5">
    <div class="row g-4">

      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="card-title h4 mb-3">Workshop details</h2>

            <p class="fw-bold mb-0">Day</p>
            <p>Saturday</p>

            <p class="fw-bold mb-0">Location</p>
            <p>School computer lab</p>

            <p class="fw-bold mb-0">What to bring</p>
            <p class="mb-0">A laptop and charger</p>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="card-title h4 mb-3">Register for a session</h2>

            <form onsubmit="event.preventDefault(); this.reset();">
              <div class="mb-3">
                <label for="fullName" class="form-label">Full name</label>
                <input type="text" class="form-control" id="fullName" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required>
              </div>

              <div class="mb-3">
                <p class="fw-bold mb-1">Choose a session</p>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="session" id="morning" required>
                  <label class="form-check-label" for="morning">Morning · 9:00–11:00 AM</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="session" id="afternoon">
                  <label class="form-check-label" for="afternoon">Afternoon · 2:00–4:00 PM</label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary px-4">Register</button>
              <p class="text-muted small mt-3 mb-0">Practice form. Entries are discarded.</p>
            </form>
          </div>
        </div>
      </div>

    </div> 
  </main> 


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
